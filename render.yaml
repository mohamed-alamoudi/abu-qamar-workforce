# Render Blueprint — خادم NestJS + قاعدة PostgreSQL مُدارة.
# (Render يقرأ هذا الملف من جذر المستودع. الشرح في docs/deployment.md و infra/render/README.md)
#
# بيئة Staging: أنشئ Blueprint ثانيًا من الملف نفسه باسم مختلف وقاعدة بيانات مستقلة،
# ولا تنسخ بيانات الإنتاج إليها.
services:
  - type: web
    name: abu-qamar-api
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1
    dockerfilePath: ./infra/render/Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: abu-qamar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # القيم التالية تُدخل يدويًا من لوحة Render (sync: false = لا تُحفظ في المستودع)
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: SETUP_TOKEN_EXPIRES_AT
        sync: false
      # الطلبات تمر عبر: المتصفح → Vercel → موازن Render → الخادم
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ENABLE_API_DOCS
        value: "false"
      - fromGroup: abu-qamar-backup-storage

  - type: cron
    name: abu-qamar-backups
    runtime: docker
    region: frankfurt
    schedule: "0 1 * * *"
    dockerfilePath: ./infra/render/Dockerfile
    dockerCommand: pnpm --filter @abu-qamar/api backup scheduled
    envVars:
      - key: APP_URL
        value: https://localhost
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - fromGroup: abu-qamar-backup-storage
      - key: DATABASE_URL
        fromDatabase:
          name: abu-qamar-db
          property: connectionString

envVarGroups:
  - name: abu-qamar-backup-storage
    envVars:
      - key: BACKUP_STORAGE_DRIVER
        value: s3

databases:
  - name: abu-qamar-db
    databaseName: abu_qamar
    user: abu_qamar
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
