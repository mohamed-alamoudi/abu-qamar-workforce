packages:
  - "apps/*"
  - "packages/*"
  - "tests/e2e"

# pnpm 10 يمنع سكربتات التثبيت افتراضيًا؛ نسمح فقط للحزم الموثوقة التي تحتاجها.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "sharp"
  - "@swc/core"
  - "unrs-resolver"

# النسخ المصححة للاعتماديات الانتقالية التي تثبتها الحزم الأم على إصدارات أقدم.
overrides:
  'next>postcss': '8.5.32'
  '@prisma/config>deepmerge-ts': '8.0.0'
  'exceljs>uuid': '11.1.1'
