<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244b90">
  <title>الدوام دون اتصال — أبو قمر</title>
  <style>
    :root { color-scheme: light; --bg: #f3f5f9; --card: #fff; --ink: #0c1220; --muted: #526178; --line: #dbe2ed; --brand: #244b90; }
    :root.dark { color-scheme: dark; --bg: #0c1220; --card: #182235; --ink: #eff4ff; --muted: #b1bdd0; --line: #364359; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: .75rem; padding: .75rem max(1rem, env(safe-area-inset-right)); background: var(--card); border-bottom: 1px solid var(--line); }
    header img { border-radius: .5rem; }
    header span { margin-inline-start: auto; border: 1px solid var(--line); padding: .3rem .6rem; border-radius: .5rem; font-size: .8rem; }
    main { max-width: 72rem; margin: auto; padding: 1rem 1rem max(2rem, env(safe-area-inset-bottom)); }
    h1 { font-size: 1.5rem; margin-block: .25rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
    section { background: var(--card); padding: 1rem; border: 1px solid var(--line); border-radius: .75rem; margin-block: .85rem; }
    button, a, select, input { font: inherit; padding: .65rem .8rem; border-radius: .5rem; }
    select, input { display: block; width: 100%; min-width: 0; min-height: 44px; margin: .35rem 0 .75rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    button, a { display: inline-block; background: var(--brand); color: #fff; border: 1px solid transparent; min-height: 44px; }
    button:disabled { opacity: .5; }
    :focus-visible { outline: 2px solid #5889df; outline-offset: 2px; }
    .secondary, #employee-results button, #open-shifts button, #queue button { background: var(--card); color: var(--ink); border-color: var(--line); }
    .fields, .actions { display: grid; gap: .65rem; }
    @media (min-width: 640px) { .fields, .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .muted, #zone { color: var(--muted); font-size: .875rem; }
    details { margin-block: .75rem; }
    summary { cursor: pointer; padding-block: .5rem; }
    ul { list-style: none; padding: 0; margin: .25rem 0; }
    li { padding-block: .45rem; overflow-wrap: anywhere; }
    #queue li + li, #open-shifts li + li { border-top: 1px solid var(--line); }
    #employee-results { max-height: 14rem; overflow: auto; }
    #employee-results button { width: 100%; text-align: start; }
    #result:empty { display: none; }
  </style>
  <script src="/offline-attendance.js" defer></script>
</head>
<body>
  <header>
    <img src="/icon-192.png?v=2" width="40" height="40" alt="">
    <strong>سوبر ماركت أبو قمر</strong>
    <span>دون اتصال</span>
  </header>
  <main>
    <h1>الحضور والانصراف</h1>
    <p id="notice" class="muted">جارٍ فتح بيانات الدوام المحلية…</p>
    <section id="record" hidden>
      <h2>التسجيل السريع</h2>
      <div class="fields"><div>
      <label for="search">بحث عن موظف بالاسم أو الكود</label><input id="search" type="search" autocomplete="off">
      <ul id="employee-results" aria-label="نتائج البحث عن موظف" hidden></ul>
      </div>
      <div id="department-field" hidden>
        <label for="department">قسم الوردية</label><select id="department"></select>
      </div>
      </div>
      <p id="zone"></p>
      <p id="open-shift"></p>
      <details id="time-fields">
      <summary>تحديد التاريخ والوقت</summary>
      <p>اترك الحقول فارغة لتسجيل الحضور أو الانصراف بالوقت الحالي.</p>
      <div class="fields">
      <div id="arrival-field"><label for="arrival">وقت الحضور</label><input id="arrival" type="datetime-local"></div>
      <div id="departure-field"><label for="departure">وقت الانصراف</label><input id="departure" type="datetime-local"></div>
      </div>
      <button id="manual" class="secondary" type="button">حفظ وردية كاملة</button>
      </details>
      <div class="actions">
        <button id="in" type="button">تسجيل الحضور</button>
        <button id="out" type="button">تسجيل الانصراف</button>
      </div>
      <p role="status" id="result"></p>
    </section>
    <section id="open-card" hidden><h2>الورديات المفتوحة على الجهاز</h2><ul id="open-shifts"></ul></section>
    <section id="queue-card" hidden><h2>مزامنة الدوام</h2><ul id="queue"></ul></section>
    <a class="secondary" href="/attendance">فتح الدوام والمزامنة</a>
  </main>
</body>
</html>
