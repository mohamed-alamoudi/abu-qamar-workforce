<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244b90">
  <title>الدوام دون اتصال — أبو قمر</title>
  <style>
    body { margin: 0; background: #f3f5f9; color: #0c1220; font: 1rem system-ui, sans-serif; }
    main { max-width: 32rem; margin: auto; padding: 1.5rem; }
    button, a, select, input { font: inherit; padding: .7rem; border-radius: .5rem; }
    select, input { box-sizing: border-box; display: block; width: 100%; margin: .35rem 0 1rem; }
    button, a { display: inline-block; background: #244b90; color: #fff; margin: .25rem 0; }
    button:disabled { opacity: .55; }
    li { margin-block: .35rem; }
  </style>
  <script src="/offline-attendance.js" defer></script>
</head>
<body>
  <main>
    <img src="/icon-192.png" width="64" height="64" alt="">
    <h1>الدوام دون اتصال</h1>
    <p id="notice">جارٍ فتح بيانات الدوام المحلية…</p>
    <section id="record" hidden>
      <label for="search">بحث بالاسم أو الكود</label><input id="search" type="search">
      <label for="employee">الموظف</label><select id="employee"></select>
      <button id="in" type="button">تسجيل الحضور</button>
      <button id="out" type="button">تسجيل الانصراف</button>
    </section>
    <p role="status" id="result"></p>
    <ul id="queue"></ul>
    <a href="/attendance">فتح الدوام والمزامنة</a>
  </main>
</body>
</html>
